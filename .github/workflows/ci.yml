name: CI

on: pull_request

jobs:
  test-py3:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lib/pyproject.toml

      - name: Install dependencies
        working-directory: lib
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis protobuf

      - name: Run pytest
        working-directory: lib
        run: python -m pytest tests/py_test/ -v

  test-py2:
    name: pytest (Python 2.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run pytest inside Python 2.7 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/lib \
            -e PYTHONPATH=/workspace/lib \
            python:2.7 \
            bash -c "
              python -m pip install --upgrade 'pip<21' 'setuptools<45' &&
              pip install -r tests/requirements-python2-dev.txt &&
              python -m pytest tests/py_test/ -v
            "

  lint:
    name: black + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: lib/pyproject.toml

      - name: Install lint tools
        working-directory: lib
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black mypy

      - name: Check formatting with black
        working-directory: lib
        run: black --check --diff .

      - name: Type check with mypy
        working-directory: lib
        run: mypy --strict --disable-bytearray-promotion blackboxprotobuf/
